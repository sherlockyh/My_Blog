# 单镜像内 nginx：托管前端静态文件、反代后端 API。
# 后端与 nginx 同容器，地址固定为 127.0.0.1:7001，无需模板变量。
server {
    listen 80;
    server_name _;
    # 后端上传接口限制 5MB，nginx 默认 1m 会先拦截 multipart 请求。
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 容器自身存活探针（静态返回，不依赖后端进程）。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 后端 NestJS 全局前缀就是 /api，proxy_pass 不带 URI 即原样透传路径。
    location /api/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 产物带内容哈希，可长缓存。
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA history fallback：直链 /articles/{slug} 刷新不 404。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 入口 html 必须每次回源校验：否则浏览器缓存旧 html，去请求已被新构建替换的 hash 资源导致样式/脚本全 404。
        add_header Cache-Control "no-cache";
    }
}
