services:
  # 单镜像应用：nginx（前端静态 + /api 反代）+ NestJS 后端同容器，
  # 启动时自动执行 prisma migrate deploy。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 7001
      DATABASE_URL: postgresql://blog:blog123@postgres:5432/my_blog
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set-JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set-ADMIN_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: my-blog
      # 复用 MinIO root 凭证，一份凭据两处使用。
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set-MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set-MINIO_ROOT_PASSWORD}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000}
    ports:
      - '${APP_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:7001/api/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      # 启动期要跑数据库迁移，多留点时间。
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: blog-postgres
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog123
      POSTGRES_DB: my_blog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d my_blog']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: blog-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # 对象存储（S3 兼容），托管上传图片；浏览器经 9000 端口直连读取。
  # 镜像固定在带 Web 控制台的最后一个社区版；管理也可用 mc 命令行。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: blog-minio
    command: ['server', '/data', '--console-address', ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set-MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set-MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  minio-data:
