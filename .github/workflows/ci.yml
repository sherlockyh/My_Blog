name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @my-blog/server prisma:generate

      - name: Build shared package
        run: pnpm --filter @my-blog/shared build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm --filter @my-blog/server test
        env:
          # e2e 启动需通过 config.validation 的格式校验，外部依赖已 mock，无需真实服务
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
