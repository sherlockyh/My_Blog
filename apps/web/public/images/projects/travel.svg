    <ellipse cx="180" cy="80" rx="34" ry="14"/>
    <ellipse cx="320" cy="60" rx="40" ry="14"/>
  </g>
  <!-- photo frame -->
  <g transform="rotate(-6 130 300)">
    <rect x="60" y="240" width="150" height="110" rx="10" fill="#ffffff"/>
    <rect x="72" y="252" width="126" height="66" rx="6" fill="#7dd3fc"/>
    <path d="M72 302 L110 272 L140 296 L164 278 L198 302 L198 318 L72 318 Z" fill="#3b82f6"/>
    <circle cx="166" cy="266" r="9" fill="#fbbf24"/>
