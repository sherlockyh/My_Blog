<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="v1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="v2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#v1)"/>
  <!-- sun -->
  <circle cx="470" cy="110" r="56" fill="url(#v2)"/>
  <circle cx="470" cy="110" r="80" stroke="#ffffff" stroke-width="4" opacity="0.35" fill="none"/>
  <!-- mountains -->
  <path d="M0 400 L180 190 L320 340 L420 240 L640 400 Z" fill="#1e3a8a" opacity="0.85"/>
  <path d="M0 400 L120 260 L260 400 Z" fill="#172554" opacity="0.9"/>
