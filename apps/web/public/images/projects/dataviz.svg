<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1f4b"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#d1)"/>
  <circle cx="560" cy="60" r="90" fill="#22d3ee" opacity="0.14"/>
  <circle cx="60" cy="350" r="70" fill="#1677ff" opacity="0.25"/>
  <!-- bars -->
  <rect x="90" y="220" width="52" height="110" rx="8" fill="#3b82f6"/>
  <rect x="170" y="170" width="52" height="160" rx="8" fill="#60a5fa"/>
  <rect x="250" y="130" width="52" height="200" rx="8" fill="#22d3ee"/>
  <rect x="330" y="200" width="52" height="130" rx="8" fill="#93c5fd"/>
  <!-- line chart -->
  <polyline points="90,180 180,140 270,150 360,90 470,120 560,70" stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="360" cy="90" r="9" fill="#fbbf24"/>
  <!-- donut -->
  <circle cx="480" cy="270" r="56" stroke="#0f1f4b" stroke-width="26" fill="none"/>
  <circle cx="480" cy="270" r="56" stroke="#22d3ee" stroke-width="26" fill="none" stroke-dasharray="220 132" stroke-linecap="round" transform="rotate(-90 480 270)"/>
  <circle cx="480" cy="270" r="56" stroke="#f472b6" stroke-width="26" fill="none" stroke-dasharray="80 272" stroke-dashoffset="-220" stroke-linecap="round" transform="rotate(-90 480 270)"/>
</svg>
