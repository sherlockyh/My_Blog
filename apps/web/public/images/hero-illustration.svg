<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" fill="none">
  <defs>
    <linearGradient id="hGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4096ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="hBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#4096ff"/>
    </linearGradient>
    <linearGradient id="hCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="hSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1d4ed8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- glow background -->
  <circle cx="320" cy="250" r="230" fill="url(#hGlow)"/>
  <circle cx="520" cy="120" r="10" fill="#4096ff" opacity="0.5"/>
  <circle cx="110" cy="380" r="7" fill="#22d3ee" opacity="0.6"/>
  <circle cx="560" cy="360" r="14" fill="none" stroke="#93c5fd" stroke-width="4" opacity="0.6"/>
  <circle cx="90" cy="130" r="12" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.5"/>

  <!-- laptop body -->
  <g filter="url(#hSoft)">
    <rect x="150" y="150" width="340" height="220" rx="16" fill="url(#hScreen)"/>
    <rect x="162" y="162" width="316" height="196" rx="8" fill="#0d1526"/>
    <!-- code lines -->
    <rect x="182" y="186" width="120" height="10" rx="5" fill="#60a5fa"/>
    <rect x="310" y="186" width="60" height="10" rx="5" fill="#f472b6"/>
    <rect x="202" y="208" width="90" height="10" rx="5" fill="#34d399"/>
    <rect x="300" y="208" width="110" height="10" rx="5" fill="#93c5fd"/>
    <rect x="202" y="230" width="140" height="10" rx="5" fill="#fbbf24"/>
    <rect x="222" y="252" width="80" height="10" rx="5" fill="#22d3ee"/>
    <rect x="310" y="252" width="70" height="10" rx="5" fill="#60a5fa"/>
    <rect x="202" y="274" width="60" height="10" rx="5" fill="#f472b6"/>
    <rect x="270" y="274" width="120" height="10" rx="5" fill="#93c5fd"/>
    <rect x="182" y="296" width="100" height="10" rx="5" fill="#34d399"/>
    <rect x="290" y="296" width="50" height="10" rx="5" fill="#fbbf24"/>
    <!-- cursor -->
    <rect x="348" y="294" width="8" height="14" rx="2" fill="#22d3ee"/>
  </g>
  <!-- laptop base -->
  <path d="M120 370 L520 370 L560 404 Q562 414 550 414 L90 414 Q78 414 80 404 Z" fill="#dbe7fb"/>
  <rect x="270" y="370" width="100" height="10" rx="5" fill="#b6cdf5"/>

  <!-- floating React badge -->
  <g filter="url(#hSoft)">
    <rect x="452" y="110" width="92" height="92" rx="22" fill="url(#hCard)"/>
    <g stroke="#1677ff" stroke-width="5" fill="none">
      <ellipse cx="498" cy="156" rx="30" ry="12"/>
      <ellipse cx="498" cy="156" rx="30" ry="12" transform="rotate(60 498 156)"/>
      <ellipse cx="498" cy="156" rx="30" ry="12" transform="rotate(120 498 156)"/>
    </g>
    <circle cx="498" cy="156" r="6" fill="#1677ff"/>
  </g>

  <!-- floating TS badge -->
  <g filter="url(#hSoft)">
    <rect x="92" y="190" width="76" height="76" rx="18" fill="url(#hBlue)"/>
    <text x="130" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">TS</text>
  </g>

  <!-- floating heart / joy chip -->
  <g filter="url(#hSoft)">
    <rect x="470" y="270" width="86" height="46" rx="23" fill="#ffffff"/>
    <circle cx="494" cy="293" r="9" fill="#fbbf24"/>
    <rect x="510" y="288" width="34" height="9" rx="4.5" fill="#dbe7fb"/>
  </g>
</svg>
